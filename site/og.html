<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Template for the 1200×630 preview-card image. Rendered by `npm run og`; not deployed. -->
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0a0708; color: #f3eadb; position: relative; font-family: "VT323", monospace; }
  .bg { position: absolute; inset: 0 0 0 340px; background: url(assets/gifs/hero-twins.webp) 50% 40% / cover; filter: saturate(1.1) contrast(1.1); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, #0a0708 0 29%, rgba(10,7,8,.75) 40%, rgba(10,7,8,.1) 62%, rgba(10,7,8,.15)),
    radial-gradient(120% 90% at 0% 100%, rgba(224,22,43,.45), transparent 60%); }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); }
  .osd { position: absolute; font-size: 38px; color: #fff; text-shadow: 3px 0 rgba(224,22,43,.9), -3px 0 rgba(0,200,255,.6); letter-spacing: .06em; }
  .tr { top: 34px; right: 44px; display: flex; gap: 12px; align-items: center; }
  .tr i { width: 18px; height: 18px; border-radius: 50%; background: #e0162b; box-shadow: 0 0 12px #e0162b; display: inline-block; }
  .br { bottom: 30px; right: 44px; }
  .content { position: absolute; left: 64px; top: 70px; width: 720px; }
  .kicker { font-size: 34px; letter-spacing: .14em; color: #ff6a13; text-transform: uppercase; }
  h1 { margin: 14px 0 0; font: 400 104px/1 "Nosifer", sans-serif; color: #e0162b; text-shadow: 0 0 30px rgba(224,22,43,.6), 0 5px 0 #6e0510; white-space: nowrap; }
  .sub { margin-top: 26px; font: 400 54px/1 "Bebas Neue", sans-serif; letter-spacing: .03em; }
  .dates { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
  .dates span { font: 400 40px/1 "Bebas Neue", sans-serif; background: #f3eadb; color: #120c0e; padding: 10px 14px 6px; border-radius: 10px; box-shadow: 0 5px 0 #8f8272; }
  .tape { position: absolute; left: -40px; right: -40px; bottom: 96px; transform: rotate(-2.5deg); background: #e0162b; border-block: 4px solid #000; font: 400 40px/1 "Bebas Neue", sans-serif; letter-spacing: .08em; padding: 10px 0 6px; white-space: nowrap; color: #fff; display: none; }
</style>
</head>
<body>
  <div class="bg"></div><div class="shade"></div><div class="scan"></div>
  <div class="osd tr"><i></i>REC</div>
  <div class="content">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="dates" id="dates"></div>
  </div>
</body>
</html>
